<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Attendance Manager</h1>

        <p>
            Plan your semester. Know how much you can skip.
        </p>

    </div>


    <form action="/calculate"
          method="POST"
          id="attendanceForm">


        <div class="card">

            <h2>Semester Details</h2>

            <div class="grid">

                <div class="input-group">

                    <label>Semester Start</label>

                    <input
                        type="date"
                        name="start_date"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Semester End</label>

                    <input
                        type="date"
                        name="end_date"
                        required
                    >

                </div>

            </div>


            <div class="input-group">

                <label>
                    Required Attendance (%)
                </label>

                <input
                    type="number"
                    name="threshold"
                    min="1"
                    max="100"
                    value="75"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Number of Subjects
                </label>

                <input
                    type="number"
                    id="subjectCount"
                    name="number_of_subjects"
                    min="1"
                    max="20"
                    required
                >

            </div>

        </div>


        <div class="card">

            <h2>Subjects</h2>

            <div id="subjectsContainer"></div>

        </div>


        <button
            type="submit"
            class="calculate-btn">

            Calculate Attendance

        </button>

    </form>

</div>


<script>

const subjectCount =
    document.getElementById("subjectCount");

const subjectsContainer =
    document.getElementById("subjectsContainer");


subjectCount.addEventListener(
    "input",
    generateSubjects
);


function generateSubjects() {

    const count =
        parseInt(subjectCount.value) || 0;

    subjectsContainer.innerHTML = "";


    for (let i = 0; i < count; i++) {

        const subject =
            document.createElement("div");

        subject.className =
            "subject";


        subject.innerHTML = `

            <h3>Subject ${i + 1}</h3>

            <div class="grid">

                <div class="input-group">

                    <label>Subject Name</label>

                    <input
                        type="text"
                        name="name_${i}"
                        placeholder="e.g. Mathematics"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Classes Per Week</label>

                    <input
                        type="number"
                        name="classes_${i}"
                        min="1"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Current Attendance (%)</label>

                    <input
                        type="number"
                        name="attendance_${i}"
                        min="0"
                        max="100"
                        step="0.01"
                        required
                    >

                </div>

            </div>

        `;


        subjectsContainer.appendChild(subject);

    }

}

</script>
<footer class="site-footer">
    © C. Karthikeya Gudimella
</footer>
</body>

</html>
